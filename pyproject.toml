[project]
name = "mini-ijepa"
version = "0.1.0"
description = "I-JEPA image world model from scratch"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pillow",
    "pyyaml",
    "timm",
    "pytest",
    "torch==2.11.0+cu128",
    "torchvision==0.26.0+cu128",
    "matplotlib>=3.11.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
find-links = ["https://download.pytorch.org/whl/cu128"]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
